<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreetEats - Food Trucks Near You</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <div class="css-logo-brand">
        <div class="logo-icon"></div>
        <div class="logo-text">
          <h1>STREET<span>EATS</span></h1>
          <p>Trucks Near You!</p>
        </div>
      </div>
    </div>
    
    <div class="css-logo-bell" title="Notifications">
      <div class="bell-top"></div>
      <div class="bell-body"></div>
      <div class="bell-clapper"></div>
    </div>
  </header>

  <main class="main-content">
    
    <section class="truck-status-container">
      <button class="truck-btn">
        <span>WAFFLE TRUCK</span>
        <span class="status-dot green"></span>
      </button>
      <button class="truck-btn">
        <span>WINGS ON TIRE</span>
        <span class="status-dot red"></span>
      </button>
      <button class="truck-btn">
        <span>CHEEZY TRUCK</span>
        <span class="status-dot black"></span>
      </button>
    </section>

    <section class="map-and-stops">
      
      <div class="map-section">
        <div class="map-card">
          <div class="map-pin pin-a">A</div>
          <div class="map-pin pin-b">B</div>
          <div class="map-pin pin-c">C</div>
        </div>

        <div class="rating-links">
          <a href="#" class="rate-item">
            <span>Tap To Rate Stops</span>
            <div class="icon-location"></div>
          </a>
          <a href="#" class="rate-item">
            <span>Tap To Rate Food Trucks</span>
            <div class="icon-truck">
              <div class="truck-cab"></div>
              <div class="truck-wheel w1"></div>
              <div class="truck-wheel w2"></div>
            </div>
          </a>
        </div>
      </div>

      <div class="stops-section">
        <h2>TODAYS STOPS</h2>
        <button class="stop-btn">NIGHT MARKET<br>UPPER EAST</button>
        <button class="stop-btn">NIGHT MARKET<br>LACSON</button>
        <button class="stop-btn">BACOLOD<br>CAPITAL PARK</button>
      </div>

    </section>

  </main>

  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <div class="nav-icon map-icon"></div>
      <span>Map</span>
    </a>
    <a href="#" class="nav-item">
      <div class="nav-icon heart-icon"></div>
      <span>Saved</span>
    </a>
    <a href="#" class="nav-item">
      <div class="nav-icon user-icon"></div>
      <span>Account</span>
    </a>
  </nav>

</body>
</html>
